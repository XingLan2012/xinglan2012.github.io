<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function() {
  var listEl = document.getElementById('ioerList');
  var contentEl = document.getElementById('ioerContent');
  var renderEl = document.getElementById('ioerRender');
  var REPO = 'XingLan2012/xinglan2012.github.io';

  // marked 配置
  marked.setOptions({
    breaks: true,
    gfm: true
  });

  async function loadFileList() {
    listEl.innerHTML = '<div class="ioer-loading">✦ 加载中...</div>';

    try {
      var resp = await fetch('https://api.github.com/repos/' + REPO + '/contents/ioer');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var data = await resp.json();

      var files = data.filter(function(f) { return f.type === 'file' && f.name.endsWith('.md'); });
      if (files.length === 0) {
        listEl.innerHTML = '<div class="ioer-empty">✦ 暂无笔记</div>';
        return;
      }

      files.sort(function(a,b) { return b.name.localeCompare(a.name); });
      var count = files.length;

      var html = '';
      files.forEach(function(f, idx) {
        var name = f.name.replace(/\.md$/, '');
        var dateMatch = name.match(/^(\d{8})/);
        var dateStr = '';
        if (dateMatch) {
          var d = dateMatch[1];
          dateStr = d.slice(0,4) + '-' + d.slice(4,6) + '-' + d.slice(6,8);
        }
        var displayName = name.replace(/^\d{8}/, '').replace(/^[\s\+]+/, '') || name;

        html += '<div class="ioer-item" data-idx="' + idx + '" data-url="' + f.download_url + '">'
          + '<span class="icon">⌨</span>'
          + '<span>' + displayName + '</span>'
          + (dateStr ? '<span class="date">' + dateStr + '</span>' : '')
          + '</div>';
      });

      // 显示文件数量
      listEl.innerHTML = html;

      // 绑定点击事件 - 行内渲染
      var items = listEl.querySelectorAll('.ioer-item');
      items.forEach(function(item) {
        item.addEventListener('click', function() {
          var url = this.dataset.url;
          // 高亮当前
          items.forEach(function(el) { el.classList.remove('active'); });
          this.classList.add('active');
          // 加载渲染
          loadAndRender(url);
        });
      });

      // 自动选中第一个
      if (items.length > 0) {
        items[0].click();
      }

    } catch(e) {
      listEl.innerHTML = '<div class="ioer-error">⚠ 加载失败 (' + e.message + ')</div>';
    }
  }

  async function loadAndRender(url) {
    contentEl.classList.add('open');
    renderEl.innerHTML = '<div class="ioer-content-loading">✦ 加载中...</div>';

    try {
      var resp = await fetch(url);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var md = await resp.text();

      // 使用 marked 渲染
      var html = marked.parse(md);

      // 如果没有标题，添加文件名
      renderEl.innerHTML = html;

      // 处理代码块内的行首减号被误解析为列表的问题
      // marked 已经处理了，不需要额外操作

    } catch(e) {
      renderEl.innerHTML = '<div class="ioer-error">⚠ 渲染失败 (' + e.message + ')</div>';
    }
  }

  loadFileList();
})();
</script>
