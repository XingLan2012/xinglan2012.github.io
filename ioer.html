<div class="ioer-wrap">
  <div class="ioer-title">⌨ OIer 专项</div>

    </div>
  </div>

  <!-- 单页笔记视图 -->
  <div class="ioer-page" id="ioerPageView">
    <div class="ioer-back" id="ioerBackBtn">← 返回列表</div>
    <div class="ioer-page-title" id="ioerPageTitle"></div>
    <div class="ioer-render" id="ioerRender"></div>
    <div class="ioer-disclaimer">

    </div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function() {
  var listView = document.getElementById('ioerListView');
  var pageView = document.getElementById('ioerPageView');
  var listEl = document.getElementById('ioerList');
  var renderEl = document.getElementById('ioerRender');
  var pageTitle = document.getElementById('ioerPageTitle');
  var backBtn = document.getElementById('ioerBackBtn');
  var REPO = 'XingLan2012/xinglan2012.github.io';

  var FILE_MAP = {}; // displayName -> download_url

  marked.setOptions({ breaks: true, gfm: true });

  // 解析 URL 参数 ?file=xxx
  function getUrlParam(name) {
    var m = location.search.match(new RegExp('[?&]' + name + '=([^&]+)'));
    return m ? decodeURIComponent(m[1]) : null;
  }

  // 切换视图
  function showList() {
    listView.style.display = 'block';
    pageView.classList.remove('open');
    // 清除 URL 参数
    history.replaceState(null, '', location.pathname);
  }

  function showPage(fileName) {
    listView.style.display = 'none';
    pageView.classList.add('open');
    pageTitle.textContent = fileName.replace(/_/g, ' ');
    // 更新 URL
    history.replaceState(null, '', '?file=' + encodeURIComponent(fileName));
    loadNote(fileName);
  }

  backBtn.addEventListener('click', showList);

  // 加载笔记内容
  async function loadNote(fileName) {
    renderEl.innerHTML = '<div class="ioer-loading">✦ 加载中...</div>';
    var url = FILE_MAP[fileName];
    if (!url) {
      renderEl.innerHTML = '<div class="ioer-error">⚠ 未找到该笔记</div>';
      return;
    }
    try {
      var resp = await fetch(url);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var md = await resp.text();
      renderEl.innerHTML = marked.parse(md);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch(e) {
      renderEl.innerHTML = '<div class="ioer-error">⚠ 加载失败 (' + e.message + ')</div>';
    }
  }

  // 加载文件列表
  async function loadFileList() {
    listEl.innerHTML = '<div class="ioer-loading">✦ 加载中...</div>';

    try {
      var resp = await fetch('https://api.github.com/repos/' + REPO + '/contents/ioer');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var data = await resp.json();

      var files = data.filter(function(f) { return f.type === 'file' && f.name.endsWith('.md'); });
      if (files.length === 0) {
        listEl.innerHTML = '<div class="ioer-empty">✦ 暂无笔记</div>';
        return;
      }

      files.sort(function(a,b) { return b.name.localeCompare(a.name); });

      var html = '';
      files.forEach(function(f) {
        var name = f.name.replace(/\.md$/, '');
        var dateMatch = name.match(/^(\d{8})/);
        var dateStr = '';
        if (dateMatch) {
          var d = dateMatch[1];
          dateStr = d.slice(0,4) + '-' + d.slice(4,6) + '-' + d.slice(6,8);
        }
        var displayName = name.replace(/^\d{8}/, '').replace(/^[\s\+]+/, '') || name;

        FILE_MAP[displayName] = f.download_url;

        html += '<a class="ioer-item" data-name="' + displayName + '">'
          + '<span class="icon">⌨</span>'
          + '<span>' + displayName + '</span>'
          + (dateStr ? '<span class="date">' + dateStr + '</span>' : '')
          + '</a>';
      });

      listEl.innerHTML = html;

      // 绑定点击：跳转到单页
      listEl.querySelectorAll('.ioer-item').forEach(function(item) {
        item.addEventListener('click', function() {
          showPage(this.dataset.name);
        });
      });

      // 检查 URL 参数，直接打开指定笔记
      var targetFile = getUrlParam('file');
      if (targetFile && FILE_MAP[targetFile]) {
        showPage(targetFile);
      }

    } catch(e) {
      listEl.innerHTML = '<div class="ioer-error">⚠ 加载失败 (' + e.message + ')</div>';
    }
  }

  loadFileList();
})();
</script>
