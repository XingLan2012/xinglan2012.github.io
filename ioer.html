<style>
  .ioer-wrap { max-width: 720px; margin: 0 auto; padding: 20px 0; }
  .ioer-title { font-size: 22px; color: #ffd700; letter-spacing: 6px; font-weight: 300; margin-bottom: 4px; }
  .ioer-sub { font-size: 12px; color: rgba(255,215,0,0.3); letter-spacing: 3px; margin-bottom: 24px; }
  .ioer-list { display: flex; flex-direction: column; gap: 6px; }
  .ioer-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    border: 1px solid rgba(255,215,0,0.06);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    text-decoration: none;
    color: rgba(255,255,255,0.6);
  }
  .ioer-item:hover {
    border-color: rgba(255,215,0,0.15);
    background: rgba(255,215,0,0.02);
    color: #ffd700;
  }
  .ioer-item .icon { font-size: 18px; opacity: 0.5; flex-shrink: 0; }
  .ioer-item:hover .icon { opacity: 0.8; }
  .ioer-item .name { font-size: 13px; letter-spacing: 1px; }
  .ioer-item .date { font-size: 10px; color: rgba(255,255,255,0.2); margin-left: auto; flex-shrink: 0; }
  .ioer-empty { text-align: center; padding: 60px 0; color: rgba(255,215,0,0.12); letter-spacing: 3px; font-size: 13px; }
</style>

<div class="ioer-wrap">
  <div class="ioer-title">⌨ OIer 专项</div>
  <div class="ioer-sub">算法学习笔记 · 训练记录</div>
  <div class="ioer-list" id="ioerList"></div>
</div>

<script>
(function() {
  var list = document.getElementById('ioerList');
  var REPO = 'XingLan2012/xinglan2012.github.io';

  // 先尝试从 GitHub API 获取 /ioer/ 目录列表
  async function load() {
    list.innerHTML = '<p style="text-align:center;color:rgba(255,255,255,0.15);padding:40px 0;letter-spacing:2px;font-size:12px;">✦ 加载中...</p>';

    try {
      var resp = await fetch('https://api.github.com/repos/' + REPO + '/contents/ioer');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var data = await resp.json();

      // 过滤出 .md 文件
      var files = data.filter(function(f) { return f.type === 'file' && f.name.endsWith('.md'); });

      if (files.length === 0) {
        list.innerHTML = '<div class="ioer-empty">✦ 暂无笔记</div>';
        return;
      }

      // 按名称倒序排列（最新在前）
      files.sort(function(a,b) { return b.name.localeCompare(a.name); });

      var html = '';
      files.forEach(function(f) {
        var name = f.name.replace(/\.md$/, '');
        // 尝试提取日期
        var dateMatch = name.match(/^(\d{8})/);
        var dateStr = '';
        if (dateMatch) {
          var d = dateMatch[1];
          dateStr = d.slice(0,4) + '-' + d.slice(4,6) + '-' + d.slice(6,8);
        }
        var displayName = name.replace(/^\d{8}/, '').replace(/^[\s\+]+/, '') || name;
        var rawUrl = f.download_url;

        html += '<a class="ioer-item" href="' + rawUrl + '" target="_blank">'
          + '<span class="icon">⌨</span>'
          + '<span class="name">' + displayName + '</span>'
          + (dateStr ? '<span class="date">' + dateStr + '</span>' : '')
          + '</a>';
      });
      list.innerHTML = html;

    } catch(e) {
      // 备用：手动列举已知文件
      list.innerHTML = '<div class="ioer-empty">⚠ 加载失败，请稍后重试</div>';
    }
  }

  load();
})();
</script>
