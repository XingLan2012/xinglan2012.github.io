---
layout: none
---
<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mindbook · 外接知识库</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a1a; --muted:#8a8a8a;
    --border:#e6e6e6; --hover:rgba(0,0,0,.035); --link:#0366d6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121212; --fg:#e6e6e6; --muted:#7a7a7a;
      --border:#2a2a2a; --hover:rgba(255,255,255,.04); --link:#58a6ff;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  main{max-width:680px;margin:0 auto;padding:48px 24px}
  h1{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:1px}
  .sub{font-size:12px;color:var(--muted);margin:0 0 16px}
  .notice{font-size:12px;color:var(--muted);border:1px dashed var(--border);
    border-radius:6px;padding:8px 12px;margin:0 0 24px}
  .meta{font-size:12px;color:var(--muted);margin:0 0 8px}
  ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--border)}
  li{border-bottom:1px solid var(--border)}
  a{display:block;padding:9px 6px;color:var(--link);text-decoration:none;font-size:14px;word-break:break-all}
  a:hover{background:var(--hover)}
  a .tag{color:var(--muted);font-size:12px;margin-left:8px}
  .empty{padding:14px 6px;color:var(--muted);font-size:13px}
  .err{color:#d73a49}
</style>
</head>
<body>
<main>
  <h1>Mindbook · 外接知识库</h1>
  <p class="sub">/mindbook — AI 外接 Web 内容</p>
  <p class="notice">此页面为 AI 设计的外接 web 内容，供自动读取 /mindbook 目录使用；不参与站点导航，非人工浏览入口。</p>
  <p class="meta" id="meta">加载目录中…</p>
  <ul id="list"><li class="empty">正在读取 /mindbook…</li></ul>
</main>
<script>
(function(){
  var REPO='XingLan2012/xinglan2012.github.io', BRANCH='main', DIR='mindbook';
  var list=document.getElementById('list'), meta=document.getElementById('meta');

  function fmt(b){
    if(b<1024) return b+' B';
    if(b<1048576) return (b/1024).toFixed(1)+' KB';
    return (b/1048576).toFixed(1)+' MB';
  }

  function render(items){
    list.innerHTML='';
    if(!items.length){
      list.innerHTML='<li class="empty">（目录为空）</li>';
      meta.textContent='共 0 项';
      return;
    }
    items.sort(function(a,b){
      if(a.type!==b.type) return a.type==='dir' ? -1 : 1;
      return a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'});
    });
    var n=0;
    items.forEach(function(it){
      var a=document.createElement('a');
      var t=document.createElement('span'); t.className='tag';
      if(it.type==='dir'){
        a.href='https://github.com/'+REPO+'/tree/'+BRANCH+'/'+DIR+'/'+it.name;
        a.textContent=it.name; t.textContent='[目录]';
      }else{
        a.href=DIR+'/'+it.name;
        a.textContent=it.name; n++;
        t.textContent='['+fmt(it.size)+']';
      }
      a.appendChild(t);
      var li=document.createElement('li'); li.appendChild(a); list.appendChild(li);
    });
    meta.textContent='共 '+items.length+' 项（文件 '+n+' 个）';
  }

  function fail(msg){
    list.innerHTML='<li class="empty err">'+msg+'</li>';
    meta.textContent='读取失败';
  }

  fetch('https://api.github.com/repos/'+REPO+'/contents/'+DIR)
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(items){ render(items); })
    .catch(function(){
      fetch(DIR+'/manifest.json',{cache:'no-store'})
        .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(files){
          render(files.map(function(name){ return {name:name,type:'file',size:0}; }));
        })
        .catch(function(){
          fail('无法读取 /mindbook（请确认仓库公开，或稍后重试）');
        });
    });
})();
</script>
</body>
</html>
