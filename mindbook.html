---
layout: none
---
<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mindbook · 外接知识库</title>
<style>
  :root{--bg:#fff;--fg:#222;--muted:#999;--border:#eee;--link:#0366d6}
  @media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#ddd;--muted:#666;--border:#222;--link:#58a6ff}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.7 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  main{max-width:640px;margin:0 auto;padding:36px 20px}
  h1{font-size:18px;font-weight:600;margin:0 0 10px}
  .notice{font-size:12px;color:var(--muted);border:1px dashed var(--border);border-radius:6px;padding:6px 10px;margin:0 0 18px}
  ul{list-style:none;margin:0;padding:0}
  li{border-bottom:1px solid var(--border)}
  a{display:block;padding:8px 4px;color:var(--link);text-decoration:none;font-size:14px;word-break:break-all}
  a:hover{background:rgba(0,0,0,.03)}
  .tag{color:var(--muted);font-size:11px;margin-left:6px}
  .empty{padding:12px 4px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Mindbook · 外接知识库</h1>
  <p class="notice">此页面为 AI 设计的外接 web 内容，供自动读取 /mindbook 目录使用；不参与站点导航，非人工浏览入口。</p>
  <ul id="list"><li class="empty">正在读取 /mindbook…</li></ul>
</main>
<script>
(function(){
  var REPO='XingLan2012/xinglan2012.github.io', BRANCH='main', DIR='mindbook';
  var list=document.getElementById('list');

  function render(items){
    items=items.filter(function(it){ return it.name!=='manifest.json'; });
    list.innerHTML='';
    if(!items.length){ list.innerHTML='<li class="empty">（目录为空）</li>'; return; }
    items.sort(function(a,b){
      var aF=(a.name==='README.md')?1:0, bF=(b.name==='README.md')?1:0;
      if(aF!==bF) return bF-aF;
      if(a.type!==b.type) return a.type==='dir'?-1:1;
      return a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'});
    });
    items.forEach(function(it){
      var a=document.createElement('a');
      if(it.type==='dir'){
        a.href='https://github.com/'+REPO+'/tree/'+BRANCH+'/'+DIR+'/'+it.name;
        a.textContent=it.name;
      }else{
        a.href=DIR+'/'+it.name;
        a.textContent=it.name;
        if(it.name==='README.md'){
          var t=document.createElement('span'); t.className='tag'; t.textContent='[首次必读]';
          a.appendChild(t);
        }
      }
      var li=document.createElement('li'); li.appendChild(a); list.appendChild(li);
    });
  }

  fetch('https://api.github.com/repos/'+REPO+'/contents/'+DIR)
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function(){
      fetch(DIR+'/manifest.json',{cache:'no-store'})
        .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(files){ render(files.map(function(name){ return {name:name,type:'file',size:0}; })); })
        .catch(function(){ list.innerHTML='<li class="empty">无法读取 /mindbook（请确认仓库公开，或稍后重试）</li>'; });
    });
})();
</script>
</body>
</html>
