---
layout: default
title: 云盘
---

<style>
  /* 默认纯黑背景（隐藏全局轮播背景） */
  body,
  .page,
  .page__content,
  .main {
    background: #000 !important;
  }
  .bg-slideshow { display: none !important; }

  .pan-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }
  .pan-title {
    font-size: 22px;
    color: #ffd700;
    letter-spacing: 6px;
    font-weight: 300;
    margin-bottom: 4px;
  }
  .pan-sub {
    font-size: 12px;
    color: rgba(255,215,0,0.3);
    letter-spacing: 3px;
    margin-bottom: 20px;
  }

  /* 文件列表 */
  .pan-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
  }
  .pan-table th {
    padding: 10px 14px;
    text-align: left;
    font-size: 11px;
    color: rgba(255,215,0,0.3);
    letter-spacing: 2px;
    font-weight: 400;
    border-bottom: 1px solid rgba(255,215,0,0.06);
  }
  .pan-table td {
    padding: 10px 14px;
    font-size: 13px;
    color: rgba(255,255,255,0.65);
    border-bottom: 1px solid rgba(255,255,255,0.03);
    transition: background 0.2s;
  }
  .pan-table tr:hover td {
    background: rgba(255,215,0,0.02);
  }
  .pan-table .file-name {
    color: rgba(255,255,255,0.75);
    font-weight: 400;
    letter-spacing: 1px;
  }
  .pan-table .file-size {
    font-size: 11px;
    color: rgba(255,255,255,0.25);
    font-family: monospace;
  }

  /* 按钮 */
  .pan-actions { white-space: nowrap; }
  .pan-btn {
    padding: 4px 14px;
    border-radius: 14px;
    border: 1px solid;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.25s ease;
    background: transparent;
    font-family: inherit;
  }
  .pan-btn.dl {
    color: rgba(255,215,0,0.5);
    border-color: rgba(255,215,0,0.15);
  }
  .pan-btn.dl:hover {
    color: #ffd700;
    border-color: rgba(255,215,0,0.35);
    background: rgba(255,215,0,0.04);
  }

  /* 状态 */
  .pan-status {
    font-size: 12px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .pan-empty {
    text-align: center;
    padding: 60px 20px;
    color: rgba(255,215,0,0.15);
    letter-spacing: 3px;
    font-size: 13px;
  }
  .pan-error {
    text-align: center;
    padding: 40px 20px;
    color: rgba(255,100,100,0.3);
    letter-spacing: 2px;
    font-size: 12px;
  }

  /* 刷新按钮 */
  .pan-refresh {
    display: inline-block;
    padding: 6px 18px;
    border: 1px solid rgba(255,215,0,0.1);
    border-radius: 16px;
    color: rgba(255,215,0,0.3);
    font-size: 11px;
    letter-spacing: 2px;
    cursor: pointer;
    background: transparent;
    transition: all 0.25s;
    font-family: inherit;
    margin-bottom: 12px;
  }
  .pan-refresh:hover {
    border-color: rgba(255,215,0,0.2);
    color: rgba(255,215,0,0.5);
  }

  @media (max-width: 600px) {
    .pan-table th:nth-child(2),
    .pan-table td:nth-child(2) { display: none; }
    .pan-actions { white-space: normal; }
    .pan-btn { margin-bottom: 4px; }
  }

  /* 外部链接区 */
  .pan-external {
    margin-top: 30px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,215,0,0.06);
  }
  .pan-ext-title {
    font-size: 11px;
    color: rgba(255,215,0,0.3);
    letter-spacing: 3px;
    margin-bottom: 10px;
  }
  .pan-ext-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border: 1px solid rgba(255,215,0,0.08);
    border-radius: 10px;
    background: rgba(255,215,0,0.02);
    transition: all 0.2s;
    flex-wrap: wrap;
  }
  .pan-ext-item:hover {
    border-color: rgba(255,215,0,0.22);
    background: rgba(255,215,0,0.04);
  }
  .pan-ext-item .pan-ext-icon { font-size: 15px; opacity: 0.6; }
  .pan-ext-item a {
    color: rgba(255,215,0,0.75);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1px;
    transition: color 0.2s;
  }
  .pan-ext-item a:hover { color: #ffd700; }
  .pan-ext-item .pan-ext-desc {
    font-size: 11px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 1px;
  }
</style>

<div class="pan-wrap">
  <div class="pan-title">✦ 云盘</div>
  <div class="pan-sub"><code>/pan</code> 目录中的文件</div>

  <div id="panToolbar"></div>
  <div id="panFileList"><p class="pan-status">✦ 加载中...</p></div>

  <!-- 外部链接区 -->
  <div class="pan-external">
    <div class="pan-ext-title">✦ 外部链接</div>
    <div class="pan-ext-item">
      <span class="pan-ext-icon">📦</span>
      <a href="https://github.com/RinLit-233-shiroko/Class-Widgets-2/releases/download/2.0.1.0/ClassWidgets-2-Windows.zip" target="_blank" rel="noopener">ClassWidgets-2-Windows.zip</a>
      <span class="pan-ext-desc">Class Widgets 2 · Windows 桌面小组件（约 101 MB，跳转 GitHub Release 下载）</span>
    </div>
  </div>
</div>

<script>
(function() {
  var REPO = 'XingLan2012/xinglan2012.github.io';
  var PAN = 'pan';
  var CACHE_KEY = 'pan_filelist_cache';
  var CACHE_TTL = 5 * 60 * 1000; // 5 分钟缓存

  var listEl = document.getElementById('panFileList');
  var toolbarEl = document.getElementById('panToolbar');

  function fmtSize(bytes) {
    if (!bytes || bytes === 0) return '';
    var u = ['B','KB','MB','GB'];
    var i = 0;
    var s = bytes;
    while (s >= 1024 && i < 3) { s /= 1024; i++; }
    return s.toFixed(i > 0 ? 1 : 0) + ' ' + u[i];
  }

  function getCached() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      if (Date.now() - data.time > CACHE_TTL) return null;
      return data.files;
    } catch(e) { return null; }
  }

  function setCache(files) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ time: Date.now(), files: files }));
    } catch(e) {}
  }

  async function fetchFiles(force) {
    if (!force) {
      var cached = getCached();
      if (cached) return cached;
    }
    var url = 'https://api.github.com/repos/' + REPO + '/contents/' + PAN;
    var resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    var data = await resp.json();
    var files = data.filter(function(i) { return i.type === 'file'; }).map(function(i) {
      return { name: i.name, size: i.size };
    });
    setCache(files);
    return files;
  }

  // GitHub 直链下载地址
  function dlUrl(name) {
    return 'https://raw.githubusercontent.com/' + REPO + '/master/' + PAN + '/' + encodeURIComponent(name);
  }

  function fmtDate() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2)
         + ' ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
  }

  async function render() {
    listEl.innerHTML = '<p class="pan-status">✦ 加载中...</p>';
    toolbarEl.innerHTML = '';

    var files;
    try {
      files = await fetchFiles(false);
    } catch(e) {
      var cached = getCached();
      if (cached) {
        files = cached;
        listEl.innerHTML = '<p class="pan-status">⚠ 加载远程失败，使用缓存数据</p>';
      } else {
        listEl.innerHTML = '<div class="pan-error">✕ 加载失败 (' + e.message + ')</div>';
        return;
      }
    }

    if (!files || files.length === 0) {
      listEl.innerHTML = '<div class="pan-empty">✦ 暂无文件</div>';
      return;
    }

    // 按文件名排序
    files.sort(function(a,b) { return a.name.localeCompare(b.name); });

    // 工具栏
    toolbarEl.innerHTML = '<button class="pan-refresh" id="panRefreshBtn">⟳ 刷新</button>'
      + '<span class="pan-status">✦ ' + files.length + ' 个文件 · ' + fmtDate() + '</span>';

    document.getElementById('panRefreshBtn').addEventListener('click', function() {
      localStorage.removeItem(CACHE_KEY);
      render();
    });

    // 表格
    var html = '<table class="pan-table"><tr><th>文件名</th><th>大小</th><th>操作</th></tr>';
    files.forEach(function(f) {
      var ext = f.name.split('.').pop().toLowerCase();
      var icon = '◇';
      if (['png','jpg','gif','webp','svg'].indexOf(ext) >= 0) icon = '🖼';
      else if (['mp3','ogg','wav','flac'].indexOf(ext) >= 0) icon = '♪';
      else if (['zip','rar','7z','tar','gz'].indexOf(ext) >= 0) icon = '📦';
      else if (['pdf','doc','docx','xls','xlsx','ppt','pptx'].indexOf(ext) >= 0) icon = '📄';
      else if (['py','js','ts','css','html','json','yml','yaml','md'].indexOf(ext) >= 0) icon = '⌨';

      html += '<tr>'
        + '<td class="file-name">' + icon + ' ' + f.name + '</td>'
        + '<td class="file-size">' + fmtSize(f.size) + '</td>'
        + '<td class="pan-actions">'
        + '<button class="pan-btn dl" data-url="' + dlUrl(f.name) + '">⬇ 下载</button>'
        + '</td></tr>';
    });
    html += '</table>';
    listEl.innerHTML = html;

    // 绑定下载（GitHub 直链）
    document.querySelectorAll('.pan-btn.dl').forEach(function(btn) {
      btn.addEventListener('click', function() {
        window.open(this.dataset.url, '_blank');
      });
    });
  }

  render();
})();
</script>
