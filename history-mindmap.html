<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="color-scheme" content="light">
<title>八上历史 · 思维导图（第1—6课）</title>
<style>
  :root{
    --bg:#ffffff;
    --panel:#f6f6f6;
    --line:rgba(0,0,0,.14);
    --line2:rgba(0,0,0,.07);
    --fg:#111111;
    --fg2:#3d3d3d;
    --fg3:#8a8a8a;
    --gold:#a67c00;
    --gold-dim:rgba(166,124,0,.35);
    --gold-bg:rgba(255,196,0,.16);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:
      radial-gradient(1100px 600px at 12% -10%,rgba(255,196,0,.10),transparent 60%),
      radial-gradient(900px 520px at 105% 10%,rgba(0,120,255,.05),transparent 60%),
      var(--bg);
    color:var(--fg);font-family:var(--font);
    display:flex;flex-direction:column;overflow:hidden;
  }
  /* ===== 顶栏 ===== */
  header{flex:0 0 auto;border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);backdrop-filter:blur(10px);z-index:20}
  .top{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
  .brand .back{color:var(--fg3);text-decoration:none;font-size:14px;transition:.18s;align-self:center}
  .brand .back:hover{color:var(--gold)}
  .brand b{color:var(--fg);font-size:16px;letter-spacing:2px;font-weight:700}
  .brand span{color:var(--fg3);font-size:11px;letter-spacing:1px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .tab{
    border:1px solid var(--line);background:#fff;color:var(--fg2);
    font-family:inherit;font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer;
    transition:.18s;white-space:nowrap;
  }
  .tab:hover{color:var(--gold);border-color:var(--gold-dim)}
  .tab.on{background:var(--gold-bg);border-color:var(--gold-dim);color:#7a5c00;font-weight:600}
  .tab i{font-style:normal;opacity:.5;margin-right:4px;font-size:10px}
  .tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--fg2);
    font-family:inherit;font-size:12px;padding:5px 10px;border-radius:7px;cursor:pointer;transition:.18s;white-space:nowrap;
  }
  .btn:hover{color:var(--gold);border-color:var(--gold-dim);background:rgba(255,196,0,.08)}
  .btn.on{color:#7a5c00;border-color:var(--gold-dim);background:var(--gold-bg);font-weight:600}
  .search{
    border:1px solid var(--line);background:#fff;color:var(--fg);
    font-family:inherit;font-size:12px;padding:5px 10px;border-radius:7px;width:132px;outline:none;
  }
  .search:focus{border-color:var(--gold-dim);box-shadow:0 0 0 2px rgba(255,196,0,.18)}
  .search::placeholder{color:var(--fg3)}
  /* ===== 课头 + 时间轴 ===== */
  .bar{flex:0 0 auto;padding:9px 16px 8px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(0,0,0,.02),transparent)}
  .ltitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .ltitle h1{margin:0;font-size:15px;font-weight:700;letter-spacing:1px;color:var(--fg)}
  .ltitle .yr{font-size:12px;color:#7a5c00;letter-spacing:1px;background:var(--gold-bg);border:1px solid var(--gold-dim);border-radius:5px;padding:1px 7px}
  .ltitle .cnt{font-size:11px;color:var(--fg3);margin-left:auto}
  .tl{display:flex;gap:0;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
  .tl::-webkit-scrollbar{height:4px}
  .tl::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:4px}
  .ti{display:flex;align-items:center;gap:8px;padding:3px 14px 3px 0;flex:0 0 auto;position:relative}
  .ti::after{content:'';position:absolute;right:4px;top:50%;width:8px;height:1px;background:var(--line)}
  .ti:last-child::after{display:none}
  .ti .y{font-size:11px;color:#7a5c00;background:var(--gold-bg);border:1px solid var(--gold-dim);border-radius:4px;padding:1px 6px;font-variant-numeric:tabular-nums}
  .ti .e{font-size:11.5px;color:var(--fg2);white-space:nowrap}
  /* ===== 画布 ===== */
  .stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;cursor:grab}
  .stage.drag{cursor:grabbing}
  svg{display:block;width:100%;height:100%;touch-action:none}
  .hint{
    position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--fg3);pointer-events:none;
    letter-spacing:.5px;background:rgba(255,255,255,.82);border:1px solid var(--line2);padding:3px 8px;border-radius:6px;
  }
  .zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
  .zoom .btn{width:30px;height:28px;padding:0;font-size:14px;line-height:1}
  /* ===== 记忆卡 ===== */
  .foot{flex:0 0 auto;padding:7px 16px 9px;border-top:1px solid var(--line);background:rgba(0,0,0,.015);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .foot .k{font-size:11px;color:#7a5c00;letter-spacing:1px;flex:0 0 auto}
  .foot .v{font-size:12px;color:var(--fg2);line-height:1.6}
  .foot .src{font-size:10.5px;color:var(--fg3);margin-left:auto}
  /* ===== 弹层 ===== */
  .toast{
    position:fixed;left:50%;bottom:56px;transform:translate(-50%,14px);opacity:0;pointer-events:none;
    background:#fff;border:1px solid var(--line);color:var(--fg);box-shadow:0 8px 24px rgba(0,0,0,.12);
    font-size:12px;padding:8px 14px;border-radius:8px;transition:.25s;z-index:99;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  /* ===== 打印 ===== */
  @media print{
    @page{size:A4 landscape;margin:8mm}
    header,.zoom,.hint,.toast{display:none!important}
    body{background:#fff;color:#000;display:block;overflow:visible;height:auto}
    .bar{border-color:#ddd;background:#fff;padding:4px 0}
    .stage{height:150mm;overflow:visible}
    .foot{border-color:#ddd;background:#fff}
  }
  @media (max-width:640px){
    .brand span{display:none}
    .search{width:96px}
    .foot .src{display:none}
  }
</style>
</head>

/* =======================================================================
   常量与测量
   ======================================================================= */
var SVGNS = "http://www.w3.org/2000/svg";
var FONT = '-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

// 一级分支配色（按分支顺序取用）——白底下的深色系
var PALETTE = ["#c62828","#d97706","#9a7b00","#2e7d32","#1565c0","#6a1fb1","#ad1457","#00695c"];
var GOLD = "#b8860b";

// 各层级：字号 / 行高 / 内边距 / 折行宽度 / 子树间距
var FS  = [19, 15, 13, 12, 11.5, 11];
var LH  = [26, 22, 20, 18.5, 17.5, 17];
var PX  = [18, 13, 8, 6, 5, 5];
var PY  = [12, 9, 5, 4, 3, 3];
var WRAP= [190, 168, 250, 270, 280, 280];
var VGAP= [26, 16, 10, 8, 7, 6];
var HGAP= 44;

var meas = document.createElement("canvas").getContext("2d");
function fnt(d){ var i = Math.min(d, FS.length-1); return (d===0||d===1?"600 ":"") + FS[i] + "px " + FONT; }
function tw(s, d){ meas.font = fnt(d); return meas.measureText(s).width; }
function wrap(s, d){
  var maxW = WRAP[Math.min(d, WRAP.length-1)];
  meas.font = fnt(d);
  var lines = [], cur = "";
  for (var i=0;i<s.length;i++){
    var ch = s.charAt(i), t = cur + ch;
    if (cur && meas.measureText(t).width > maxW){ lines.push(cur); cur = ch; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [""];
}
function el(tag, attrs){
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs) if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]);
  return e;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* =======================================================================
   状态
   ======================================================================= */
var state = {
  lesson: 0,
  quiz: false,
  query: "",
  collapsed: {},   // lessonId -> {nodeId:true}
  revealed: {},    // lessonId -> {nodeId:true}
  nodes: [],
  byId: {},
  bbox: {w:0,h:0},
  view: {x:0,y:0,k:1}
};

var svg = document.getElementById("map");
var stage = document.getElementById("stage");
var toastEl = document.getElementById("toast");
var toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 1600);
}

function setOf(map, id){ if(!map[id]) map[id] = {}; return map[id]; }
function isCollapsed(lid, nid){ return !!(state.collapsed[lid] && state.collapsed[lid][nid]); }
function isRevealed(lid, nid){ return !!(state.revealed[lid] && state.revealed[lid][nid]); }
function isHidden(n){ return state.quiz && n.__depth >= 2 && !isRevealed(n.__lesson, n.__id); }

/* =======================================================================
   布局
   ======================================================================= */
function prepare(lesson){
  var root = lesson.root;
  var branches = root.c || [];
  var rect = stage.getBoundingClientRect();
  // 宽屏时左右分侧，窄屏（手机）时单侧右展
  var twoSide = rect.width >= 860 && branches.length >= 2;
  state.twoSide = twoSide;
  var half = Math.ceil(branches.length / 2);
  var colR = [], colL = [], count = 0;

  (function walk(nd, depth, color, pid, side){
    nd.__depth = depth;
    nd.__color = color;
    nd.__lesson = lesson.id;
    nd.__id = pid;
    nd.__side = side;
    nd.__lines = wrap(nd.n, depth);
    var w = 0, i;
    for (i=0;i<nd.__lines.length;i++) w = Math.max(w, tw(nd.__lines[i], depth));
    var d = Math.min(depth, FS.length-1);
    nd.__tw = w;
    nd.__bw = w + PX[d]*2;
    nd.__bh = nd.__lines.length*LH[d] + PY[d]*2;
    if (depth > 0){
      var col = (side < 0) ? colL : colR;
      col[depth] = Math.max(col[depth] || 0, nd.__bw);
    }
    count++;
    var kids = nd.c || [];
    for (i=0;i<kids.length;i++){
      var cs = (depth === 0) ? ((twoSide && i >= half) ? -1 : 1) : side;
      var cc = (depth === 0) ? PALETTE[i % PALETTE.length] : color;
      walk(kids[i], depth+1, cc, pid + "-" + i, cs);
    }
  })(root, 0, GOLD, "r", 0);

  root.__x = -root.__bw / 2;

  // 列坐标：右侧深度 d 节点的左边缘；左侧深度 d 节点的右边缘
  var XR = [], XL = [], d;
  XR[1] = root.__x + root.__bw + HGAP;
  for (d=2; d<colR.length; d++) XR[d] = XR[d-1] + (colR[d-1] || 0) + HGAP;
  XL[1] = root.__x - HGAP;
  for (d=2; d<colL.length; d++) XL[d] = XL[d-1] - HGAP - (colL[d-1] || 0);

  function gap(depth){ return VGAP[Math.min(depth, VGAP.length-1)]; }

  // 1) 子树高度
  (function subH(nd){
    var kids = nd.c || [];
    if (!kids.length || isCollapsed(lesson.id, nd.__id)){ nd.__subH = nd.__bh; return nd.__bh; }
    var sum = 0;
    for (var i=0;i<kids.length;i++){
      sum += subH(kids[i]);
      if (i) sum += gap(nd.__depth + 1);
    }
    nd.__subH = Math.max(nd.__bh, sum);
    return nd.__subH;
  })(root);

  // 2) 自上而下定位：父节点在自己槽位中居中，子块在父槽位中居中
  function assign(nd, top){
    if (nd.__side < 0){
      var r = XL[Math.min(nd.__depth, XL.length-1)];
      if (r === undefined) r = XL[XL.length-1] || -HGAP;
      nd.__x = r - nd.__bw;
    } else {
      var l = XR[Math.min(nd.__depth, XR.length-1)];
      if (l === undefined) l = XR[XR.length-1] || (root.__bw + HGAP);
      nd.__x = l;
    }
    nd.__y = top + nd.__subH/2;
    var kids = nd.c || [];
    if (!kids.length || isCollapsed(lesson.id, nd.__id)) return;
    var total = 0, i;
    for (i=0;i<kids.length;i++){ total += kids[i].__subH; if (i) total += gap(nd.__depth + 1); }
    var cy = top + (nd.__subH - total)/2;
    for (i=0;i<kids.length;i++){
      assign(kids[i], cy);
      cy += kids[i].__subH + gap(nd.__depth + 1);
    }
  }

  // 3) 左右两侧分别排版，再整体垂直居中
  var totals = {}, totalH = root.__bh;
  [1, -1].forEach(function(side){
    var ks = branches.filter(function(k){ return k.__side === side; });
    var t = 0;
    for (var i=0;i<ks.length;i++){ t += ks[i].__subH; if (i) t += gap(1); }
    totals[side] = t;
    totalH = Math.max(totalH, t);
  });
  [1, -1].forEach(function(side){
    var ks = branches.filter(function(k){ return k.__side === side; });
    var cy = (totalH - totals[side]) / 2;
    for (var i=0;i<ks.length;i++){
      if (i) cy += gap(1);
      assign(ks[i], cy);
      cy += ks[i].__subH;
    }
  });
  root.__y = totalH / 2;

  var nodes = [];
  (function collect(nd){
    nodes.push(nd);
    if (isCollapsed(lesson.id, nd.__id)) return;
    var kids = nd.c || [];
    for (var i=0;i<kids.length;i++) collect(kids[i]);
  })(root);

  var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (var i=0;i<nodes.length;i++){
    var n = nodes[i];
    minX = Math.min(minX, n.__x);
    maxX = Math.max(maxX, n.__x + n.__bw);
    minY = Math.min(minY, n.__y - n.__bh/2);
    maxY = Math.max(maxY, n.__y + n.__bh/2);
  }
  state.nodes = nodes;
  state.byId = {};
  for (i=0;i<nodes.length;i++) state.byId[nodes[i].__id] = nodes[i];
  state.bbox = {minX:minX, minY:minY, w:Math.max(1, maxX-minX), h:Math.max(1, maxY-minY)};
  return count;
}

/* =======================================================================
   绘制
   ======================================================================= */
function draw(lesson){
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  var defs = el("defs");
  var grad = el("linearGradient", {id:"gRoot", x1:"0", y1:"0", x2:"1", y2:"1"});
  grad.appendChild(el("stop", {offset:"0%", "stop-color":"#e0a800"}));
  grad.appendChild(el("stop", {offset:"100%", "stop-color":"#a9760a"}));
  defs.appendChild(grad);
  svg.appendChild(defs);

  var world = el("g", {id:"world"});
  world.setAttribute("transform", "translate(" + state.view.x + "," + state.view.y + ") scale(" + state.view.k + ")");
  svg.appendChild(world);

  var layerEdge = el("g"), layerNode = el("g");
  world.appendChild(layerEdge);
  world.appendChild(layerNode);

  var q = state.query.trim().toLowerCase();
  var keep = buildKeepSet(lesson.root, q);
  var anyHit = false;
  if (q){ for (var kk in keep) if (keep.hasOwnProperty(kk)){ anyHit = true; break; } }
  if (!anyHit) keep = null;   // 无匹配时不做压暗处理

  // 连线（父 → 子）
  for (var i=0;i<state.nodes.length;i++){
    var nd = state.nodes[i];
    if (isCollapsed(lesson.id, nd.__id)) continue;
    var kids = nd.c || [];
    for (var j=0;j<kids.length;j++){
      var ch = kids[j];
      var x1, x2;
      if (ch.__side < 0){ x1 = nd.__x; x2 = ch.__x + ch.__bw; }
      else { x1 = nd.__x + nd.__bw; x2 = ch.__x; }
      var y1 = nd.__y, y2 = ch.__y;
      var dx = Math.max(20, Math.abs(x2 - x1) * 0.5) * (x2 >= x1 ? 1 : -1);
      var path = el("path", {
        d: "M" + x1 + "," + y1 + " C" + (x1+dx) + "," + y1 + " " + (x2-dx) + "," + y2 + " " + x2 + "," + y2,
        fill: "none",
        stroke: ch.__color,
        "stroke-width": Math.max(1.1, 3.2 - ch.__depth*0.55),
        "stroke-opacity": Math.max(0.22, 0.78 - ch.__depth*0.13),
        "stroke-linecap": "round"
      });
      if (q && !keep[ch.__id]) path.setAttribute("stroke-opacity", "0.06");
      layerEdge.appendChild(path);
    }
  }

  // 节点
  for (i=0;i<state.nodes.length;i++){
    var n = state.nodes[i];
    var g = el("g", {"data-nid": n.__id, "class":"node"});
    var hidden = isHidden(n);
    var hit = q ? matchNode(n, q) : false;
    if (q && !keep[n.__id]) g.setAttribute("opacity", 0.15);

    var d = Math.min(n.__depth, FS.length-1);

    if (n.__depth === 0){
      g.appendChild(el("rect", {x:n.__x, y:n.__y-n.__bh/2, width:n.__bw, height:n.__bh,
        rx:12, ry:12, fill:"url(#gRoot)", stroke:"rgba(0,0,0,.18)", "stroke-width":1}));
      var t0 = el("text", {x:n.__x+n.__bw/2, y:n.__y, fill:"#ffffff", "text-anchor":"middle",
        "dominant-baseline":"middle", "font-size":FS[0], "font-weight":700});
      t0.textContent = n.__lines[0];
      g.appendChild(t0);
    } else if (n.__depth === 1){
      var left = n.__side < 0;
      g.appendChild(el("rect", {x:n.__x, y:n.__y-n.__bh/2, width:n.__bw, height:n.__bh, rx:9, ry:9,
        fill:hexA(n.__color, .07), stroke:hexA(n.__color, .38), "stroke-width":1.2}));
      g.appendChild(el("rect", {x: left ? n.__x+n.__bw-3.2 : n.__x, y:n.__y-n.__bh/2+4,
        width:3.2, height:n.__bh-8, rx:2, fill:n.__color}));
      var tx1 = left ? n.__x + n.__bw - PX[1] : n.__x + PX[1];
      var t1 = el("text", {x:tx1, y:n.__y, fill:n.__color, "dominant-baseline":"middle",
        "text-anchor": left ? "end" : "start", "font-size":FS[1], "font-weight":600});
      for (var a=0;a<n.__lines.length;a++){
        var ts = el("tspan", {x:tx1, y: n.__y - (n.__lines.length-1)*LH[1]/2 + a*LH[1],
          "text-anchor": left ? "end" : "start"});
        ts.textContent = n.__lines[a];
        t1.appendChild(ts);
      }
      g.appendChild(t1);
    } else {
      var leftN = n.__side < 0;
      if (hidden){
        g.appendChild(el("rect", {x:n.__x, y:n.__y-n.__bh/2, width:n.__bw, height:n.__bh, rx:6, ry:6,
          fill:"rgba(0,0,0,.035)", stroke:"rgba(0,0,0,.22)", "stroke-dasharray":"4 3"}));
        var qm = el("text", {x:n.__x+n.__bw/2, y:n.__y, fill:"rgba(0,0,0,.34)",
          "text-anchor":"middle", "dominant-baseline":"middle", "font-size":FS[d]+1});
        qm.textContent = "？";
        g.appendChild(qm);
      } else {
        var dotX = leftN ? n.__x + n.__bw - 3 : n.__x + 3;
        g.appendChild(el("circle", {cx:dotX, cy:n.__y, r: n.__depth===2?2.6:1.8,
          fill:hexA(n.__color, n.__depth===2?.92:.6)}));
        var tx = leftN ? n.__x + n.__bw - PX[d] - 2 : n.__x + PX[d] + 2;
        var tEl = el("text", {x:tx, y:n.__y,
          "text-anchor": leftN ? "end" : "start",
          fill: n.__depth===2 ? "#1b1b1b" : (n.__depth===3 ? "#3d3d3d" : "#5f5f5f"),
          "dominant-baseline":"middle", "font-size":FS[d]});
        for (var b=0;b<n.__lines.length;b++){
          var ts2 = el("tspan", {x:tx, y: n.__y - (n.__lines.length-1)*LH[d]/2 + b*LH[d],
            "text-anchor": leftN ? "end" : "start"});
          ts2.textContent = n.__lines[b];
          tEl.appendChild(ts2);
        }
        g.appendChild(tEl);
        if (hit){
          g.appendChild(el("rect", {x:n.__x-4, y:n.__y-n.__bh/2-2, width:n.__bw+8, height:n.__bh+4,
            rx:6, ry:6, fill:"none", stroke:"rgba(166,124,0,.85)", "stroke-width":1.2}));
        }
      }
    }

    // 折叠开关
    var kids2 = n.c || [];
    if (kids2.length){
      var collapsed = isCollapsed(lesson.id, n.__id);
      var cxp = n.__side < 0 ? n.__x - 11 : n.__x + n.__bw + 11, cyp = n.__y;
      g.appendChild(el("circle", {cx:cxp, cy:cyp, r:7.5,
        fill: collapsed ? hexA(n.__color,.92) : "#ffffff",
        stroke: hexA(n.__color,.75), "stroke-width":1.1}));
      var sg = el("text", {x:cxp, y:cyp, fill: collapsed ? "#ffffff" : n.__color,
        "text-anchor":"middle", "dominant-baseline":"middle", "font-size":11, "font-weight":700});
      sg.textContent = collapsed ? "+" : "−";
      g.appendChild(sg);
    }

    layerNode.appendChild(g);
  }

  applyView();
}

function hexA(hex, a){
  var h = hex.replace("#","");
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return "rgba(" + r + "," + g + "," + b + "," + a + ")";
}
function nodeText(n){ return n.__lines.join(""); }
function matchNode(n, q){ return nodeText(n).toLowerCase().indexOf(q) >= 0; }
// 搜索保留集：命中节点 + 其祖先链 + 其子树
function buildKeepSet(root, q){
  var keep = {};
  if (!q) return keep;
  function hasMatch(nd){
    var m = matchNode(nd, q), kids = nd.c || [], i;
    for (i=0;i<kids.length;i++) if (hasMatch(kids[i])) m = true;
    nd.__hasMatch = m;
    return m;
  }
  hasMatch(root);
  (function walk(nd, ancHit){
    if (ancHit || nd.__hasMatch) keep[nd.__id] = true;
    var kids = nd.c || [];
    for (var i=0;i<kids.length;i++) walk(kids[i], ancHit || matchNode(nd, q));
  })(root, false);
  return keep;
}

/* =======================================================================
   视图变换
   ======================================================================= */
function applyView(){
  var w = svg.querySelector("#world");
  if (w) w.setAttribute("transform", "translate(" + state.view.x + "," + state.view.y + ") scale(" + state.view.k + ")");
}
function fit(){
  var r = stage.getBoundingClientRect();
  var b = state.bbox;
  var kFit = Math.min((r.width - 80) / b.w, (r.height - 56) / b.h, 1.3);
  if (!isFinite(kFit) || kFit <= 0) kFit = 1;
  // 不缩得比 0.52 更小（保证可读），超出部分靠拖拽查看
  var k = Math.max(kFit, Math.min(0.52, 1.3));
  state.view.k = k;
  if (k <= kFit + 1e-6){
    state.view.x = (r.width - b.w * k) / 2 - b.minX * k;
    state.view.y = (r.height - b.h * k) / 2 - b.minY * k;
  } else {
    state.view.x = r.width / 2;              // 中心主题水平居中
    state.view.y = 22 - b.minY * k;          // 内容顶部对齐
  }
  applyView();
}
function zoomAt(cx, cy, factor){
  var k2 = Math.max(0.15, Math.min(4, state.view.k * factor));
  var f = k2 / state.view.k;
  state.view.x = cx - (cx - state.view.x) * f;
  state.view.y = cy - (cy - state.view.y) * f;
  state.view.k = k2;
  applyView();
}

/* =======================================================================
   交互
   ======================================================================= */
var drag = null;
var active = {};      // pointerId -> {x,y}
var pinchPrev = 0;

function activeCount(){ return Object.keys(active).length; }
function pinchDist(){
  var ids = Object.keys(active);
  if (ids.length < 2) return 0;
  var a = active[ids[0]], b = active[ids[1]];
  return Math.hypot(a.x - b.x, a.y - b.y);
}
function pinchMid(){
  var ids = Object.keys(active);
  var a = active[ids[0]], b = active[ids[1]];
  var r = svg.getBoundingClientRect();
  return {x:(a.x + b.x)/2 - r.left, y:(a.y + b.y)/2 - r.top};
}

svg.addEventListener("pointerdown", function(e){
  active[e.pointerId] = {x:e.clientX, y:e.clientY};
  if (activeCount() === 1){
    drag = {x:e.clientX, y:e.clientY, vx:state.view.x, vy:state.view.y, moved:false};
  } else {
    drag = null;
    pinchPrev = pinchDist();
  }
  try { svg.setPointerCapture(e.pointerId); } catch(err){}
});

svg.addEventListener("pointermove", function(e){
  if (!active[e.pointerId]) return;
  active[e.pointerId] = {x:e.clientX, y:e.clientY};

  if (activeCount() >= 2){
    var d = pinchDist();
    if (pinchPrev > 0 && d > 0){
      var m = pinchMid();
      zoomAt(m.x, m.y, d / pinchPrev);
    }
    pinchPrev = d;
    return;
  }
  if (!drag) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3){ drag.moved = true; stage.classList.add("drag"); }
  state.view.x = drag.vx + dx;
  state.view.y = drag.vy + dy;
  applyView();
});

function endPointer(e){
  if (active[e.pointerId]) delete active[e.pointerId];
  if (activeCount() === 0){ stage.classList.remove("drag"); pinchPrev = 0; }
  else if (activeCount() === 1){
    var ids = Object.keys(active);
    pinchPrev = 0;
    drag = {x:active[ids[0]].x, y:active[ids[0]].y, vx:state.view.x, vy:state.view.y, moved:true};
  }
}
svg.addEventListener("pointerup", endPointer);
svg.addEventListener("pointercancel", endPointer);
svg.addEventListener("pointerleave", endPointer);

svg.addEventListener("click", function(e){
  var g = e.target.closest ? e.target.closest("[data-nid]") : null;
  if (!g) return;
  if (drag && drag.moved) return;
  var nid = g.getAttribute("data-nid");
  var n = state.byId[nid];
  if (!n) return;
  var lesson = LESSONS[state.lesson];

  if (state.quiz && n.__depth >= 2 && !isRevealed(lesson.id, nid)){
    setOf(state.revealed, lesson.id)[nid] = true;
    draw(lesson);
    return;
  }
  if (n.c && n.c.length){
    var col = setOf(state.collapsed, lesson.id);
    if (col[nid]) delete col[nid]; else col[nid] = true;
    prepare(lesson);
    draw(lesson);
  }
});

svg.addEventListener("wheel", function(e){
  e.preventDefault();
  var r = svg.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 1/1.12);
}, {passive:false});

/* =======================================================================
   顶部 UI
   ======================================================================= */
var tabsEl = document.getElementById("tabs");
LESSONS.forEach(function(l, i){
  var b = document.createElement("button");
  b.className = "tab" + (i===0 ? " on" : "");
  b.innerHTML = "<i>第" + (i+1) + "课</i>" + esc(l.title);
  b.addEventListener("click", function(){ show(i); });
  tabsEl.appendChild(b);
});

function countNodes(nd){
  var n = 1, kids = nd.c || [];
  for (var i=0;i<kids.length;i++) n += countNodes(kids[i]);
  return n;
}

function show(i){
  state.lesson = i;
  var lesson = LESSONS[i];
  [].forEach.call(tabsEl.children, function(b, k){ b.classList.toggle("on", k===i); });

  document.getElementById("ltTitle").textContent = "第" + (i+1) + "课　" + lesson.title;
  document.getElementById("ltYear").textContent = lesson.period;
  document.getElementById("ltCount").textContent = "共 " + (countNodes(lesson.root) - 1) + " 个考点";
  document.getElementById("mnemonic").textContent = lesson.mnemonic;

  var tl = document.getElementById("tl");
  tl.innerHTML = "";
  lesson.timeline.forEach(function(t){
    var d = document.createElement("div");
    d.className = "ti";
    d.innerHTML = '<span class="y">' + esc(t[0]) + '</span><span class="e">' + esc(t[1]) + "</span>";
    tl.appendChild(d);
  });

  prepare(lesson);
  draw(lesson);
  fit();
}

document.getElementById("btnExpand").addEventListener("click", function(){
  var lesson = LESSONS[state.lesson];
  var all = state.collapsed[lesson.id] || {};
  var any = Object.keys(all).length > 0;
  state.collapsed[lesson.id] = {};
  if (state.quiz){ state.revealed[lesson.id] = {}; }
  prepare(lesson); draw(lesson);
  toast(any ? "已展开全部节点" : "已展开全部节点");
});

document.getElementById("btnQuiz").addEventListener("click", function(e){
  state.quiz = !state.quiz;
  e.currentTarget.classList.toggle("on", state.quiz);
  var lesson = LESSONS[state.lesson];
  state.collapsed[lesson.id] = {};
  if (state.quiz) state.revealed[lesson.id] = {};
  prepare(lesson); draw(lesson);
  document.getElementById("hint").textContent = state.quiz
    ? "自测模式：先自己回忆「？」处内容，点击即可揭晓"
    : "拖拽平移 · 滚轮缩放 · 点击节点折叠 / 展开";
  toast(state.quiz ? "自测模式：二级以下内容已隐藏" : "已退出自测模式");
});

document.getElementById("search").addEventListener("input", function(e){
  state.query = e.target.value;
  draw(LESSONS[state.lesson]);
});

document.getElementById("zin").addEventListener("click", function(){
  var r = svg.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1.2);
});
document.getElementById("zout").addEventListener("click", function(){
  var r = svg.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1/1.2);
});
document.getElementById("zfit").addEventListener("click", fit);

document.getElementById("btnFull").addEventListener("click", function(){
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  setTimeout(fit, 400);
});

document.getElementById("btnPrint").addEventListener("click", function(){ window.print(); });

document.getElementById("btnPng").addEventListener("click", function(){
  var lesson = LESSONS[state.lesson];
  var pad = 34;
  var b = state.bbox;
  var w = b.w + pad*2, h = b.h + pad*2;
  var x0 = b.minX - pad, y0 = b.minY - pad;
  var clone = svg.cloneNode(true);
  clone.setAttribute("xmlns", SVGNS);
  clone.setAttribute("width", w);
  clone.setAttribute("height", h);
  clone.setAttribute("viewBox", x0 + " " + y0 + " " + w + " " + h);
  clone.querySelector("#world").setAttribute("transform", "translate(0,0) scale(1)");
  // 深色底 + 标题
  var bg = el("rect", {x:x0, y:y0, width:w, height:h, fill:"#ffffff"});
  clone.insertBefore(bg, clone.firstChild);
  var title = el("text", {x:b.minX, y:b.minY - 12, fill:"#7a5c00", "font-size":17,
    "font-weight":700, "font-family":FONT});
  title.textContent = "第" + (state.lesson+1) + "课　" + lesson.title + "（" + lesson.period + "）";
  clone.appendChild(title);

  var data = new XMLSerializer().serializeToString(clone);
  var blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + data], {type:"image/svg+xml;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var img = new Image();
  img.onload = function(){
    var scale = 2;
    var cv = document.createElement("canvas");
    cv.width = Math.round(w*scale); cv.height = Math.round(h*scale);
    var ctx = cv.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    cv.toBlob(function(b){
      var a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = "第" + (state.lesson+1) + "课-" + lesson.title + "-思维导图.png";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
      toast("已导出 PNG（2 倍分辨率）");
    }, "image/png");
  };
  img.onerror = function(){ toast("导出失败，请改用「打印」或截图"); URL.revokeObjectURL(url); };
  img.src = url;
});

document.addEventListener("keydown", function(e){
  if (/input|textarea/i.test((e.target.tagName||""))) return;
  if (e.key === "ArrowRight" || e.key === "ArrowLeft"){
    var i = state.lesson + (e.key === "ArrowRight" ? 1 : -1);
    if (i >= 0 && i < LESSONS.length) show(i);
  } else if (e.key === "0"){ fit(); }
  else if (e.key === " "){ e.preventDefault(); document.getElementById("btnExpand").click(); }
});

var rt = null;
window.addEventListener("resize", function(){
  clearTimeout(rt);
  rt = setTimeout(function(){
    var lesson = LESSONS[state.lesson];
    prepare(lesson); draw(lesson); fit();
  }, 160);
});

/* 启动 */
function boot(){ show(0); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else boot();
window.addEventListener("load", function(){ setTimeout(function(){ prepare(LESSONS[state.lesson]); draw(LESSONS[state.lesson]); fit(); }, 60); });

})();
</script>
</body>
</html>
