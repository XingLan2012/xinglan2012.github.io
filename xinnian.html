<style>
  .xn-wrap { max-width: 600px; margin: 0 auto; padding: 16px 0; }

  /* ===== 顶部栏 ===== */
  .xn-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; flex-wrap: wrap; gap: 6px;
  }
  .xn-level {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 14px 5px 10px;
    border: 1px solid rgba(255,215,0,0.15);
    border-radius: 18px;
    background: rgba(255,215,0,0.03);
  }
  .xn-level-num { font-size: 16px; color: #ffd700; font-weight: 300; letter-spacing: 2px; }
  .xn-level-bar { width: 70px; height: 3px; background: rgba(255,215,0,0.1); border-radius: 2px; overflow: hidden; }
  .xn-level-bar-inner {
    height: 100%; background: linear-gradient(90deg, #ffd700, #ffec8b);
    border-radius: 2px; transition: width 0.5s;
  }
  .xn-level-text { font-size: 9px; color: rgba(255,255,255,0.25); min-width: 50px; }

  .xn-stats { display: flex; gap: 8px; align-items: center; }
  .xn-stat {
    text-align: center; padding: 3px 10px;
    background: rgba(255,215,0,0.02);
    border: 1px solid rgba(255,215,0,0.05);
    border-radius: 8px;
  }
  .xn-stat-val { font-size: 13px; color: #ffd700; font-weight: 300; }
  .xn-stat-lbl { font-size: 8px; color: rgba(255,255,255,0.2); letter-spacing: 1px; }

  /* ===== 操作栏 ===== */
  .xn-actions { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .xn-btn {
    padding: 6px 16px;
    border: 1px solid rgba(255,215,0,0.12);
    border-radius: 14px;
    color: #ffd700; font-size: 10px; letter-spacing: 2px;
    cursor: pointer; background: rgba(255,215,0,0.02);
    font-family: inherit; transition: all 0.2s;
  }
  .xn-btn:hover { border-color: rgba(255,215,0,0.25); background: rgba(255,215,0,0.05); }
  .xn-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ===== 背包 ===== */
  .xn-inv-title { font-size: 10px; color: rgba(255,215,0,0.15); letter-spacing: 2px; margin-bottom: 6px; }
  .xn-inventory {
    display: flex; gap: 5px; flex-wrap: wrap;
    min-height: 44px;
    padding: 6px 8px;
    border: 1px solid rgba(255,215,0,0.04);
    border-radius: 8px;
    background: rgba(255,215,0,0.01);
    margin-bottom: 12px;
  }
  .xn-inv-empty {
    width:100%; text-align:center; padding:10px 0;
    color: rgba(255,255,255,0.06); font-size:10px; letter-spacing:2px;
  }

  /* ===== 方块卡片 ===== */
  .xn-block {
    display: inline-grid;
    gap: 1px;
    cursor: grab;
    position: relative;
    padding: 2px;
    background: rgba(255,215,0,0.02);
    border: 1px solid rgba(255,215,0,0.06);
    border-radius: 3px;
    transition: all 0.2s;
  }
  .xn-block:hover {
    transform: scale(1.2); z-index: 20;
    background: rgba(255,215,0,0.06);
    border-color: rgba(255,215,0,0.2);
    box-shadow: 0 0 16px rgba(255,215,0,0.12);
  }
  .xn-block-cell {
    width: 16px; height: 16px;
    border: 1px solid rgba(255,215,0,0.05);
    background: transparent;
    transition: all 0.15s;
  }
  .xn-block-cell.filled {
    border: 2px solid rgba(255,215,0,0.3);
    background: linear-gradient(135deg, rgba(255,215,0,0.07), rgba(255,215,0,0.02));
  }
  .xn-block-cell.filled::before {
    content: ''; position: absolute;
    top: 2px; left: 2px; right: 2px; bottom: 2px;
    border: 1px solid rgba(255,215,0,0.1);
  }
  .xn-block-cell.filled::after {
    content: ''; position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 4px;
    background: repeating-linear-gradient(45deg, transparent, transparent 1px, rgba(255,215,0,0.04) 1px, rgba(255,215,0,0.04) 2px);
  }
  /* 悬停时整个方块高亮 */
  .xn-block:hover .xn-block-cell.filled {
    border-color: rgba(255,215,0,0.6);
    background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,215,0,0.05));
    box-shadow: inset 0 0 8px rgba(255,215,0,0.1);
  }

  .xn-block .xn-tip {
    display: none;
    position: absolute;
    bottom: calc(100% + 4px);
    left: 50%; transform: translateX(-50%);
    width: 120px;
    padding: 5px 8px;
    background: rgba(10,14,39,0.95);
    border: 1px solid rgba(255,215,0,0.1);
    border-radius: 6px;
    font-size: 9px;
    color: rgba(255,255,255,0.6);
    text-align: center;
    line-height: 1.4;
    pointer-events: none;
    z-index: 100;
  }
  .xn-block:hover .xn-tip { display: block; }

  /* ===== 5×5 网格 ===== */
  .xn-grid-wrap {
    margin-bottom: 12px;
    display: flex;
    justify-content: center;
  }
  .xn-grid {
    display: grid;
    grid-template-columns: repeat(5, 48px);
    grid-template-rows: repeat(5, 48px);
    gap: 3px;
    padding: 8px;
    background: rgba(10,14,39,0.6);
    border: 1px solid rgba(255,215,0,0.08);
    border-radius: 10px;
  }
  .xn-cell {
    width: 48px; height: 48px;
    background: rgba(255,215,0,0.01);
    border: 1px solid rgba(255,215,0,0.05);
    border-radius: 3px;
    transition: all 0.2s;
    cursor: pointer;
  }
  .xn-cell.has-block {
    border: 2px solid rgba(255,215,0,0.45);
    background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,215,0,0.03));
    box-shadow: inset 0 0 10px rgba(255,215,0,0.06), 0 0 4px rgba(255,215,0,0.06);
  }
  .xn-cell.has-block::before {
    content: ''; position: absolute;
    top: 5px; left: 5px; right: 5px; bottom: 5px;
    border: 1px solid rgba(255,215,0,0.1);
  }
  .xn-cell.has-block::after {
    content: ''; position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
    background: repeating-linear-gradient(45deg, transparent, transparent 1px, rgba(255,215,0,0.04) 1px, rgba(255,215,0,0.04) 2px);
  }
  .xn-cell.drag-over {
    background: rgba(255,215,0,0.12);
    border-color: rgba(255,215,0,0.4);
    box-shadow: 0 0 12px rgba(255,215,0,0.1);
  }
  .xn-cell.has-block:hover {
    border-color: rgba(255,100,100,0.4);
    box-shadow: 0 0 12px rgba(255,100,100,0.08);
  }
  .xn-cell.has-block:hover::after {
    content: '✕'; position: absolute;
    top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 14px; color: rgba(255,100,100,0.3);
    background: none;
    display: flex;
    align-items: center; justify-content: center;
  }

  /* ===== 等级表 ===== */
  .xn-ranks {
    max-width: 360px;
    margin: 0 auto;
    padding: 10px 12px;
    background: rgba(255,215,0,0.01);
    border: 1px solid rgba(255,215,0,0.03);
    border-radius: 8px;
    font-size: 9px;
    line-height: 1.8;
    color: rgba(255,255,255,0.1);
    text-align: center;
  }
  .xn-ranks span.hl { color: #ffd700; }
</style>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function(){
  var SHAPES = [
    [[1,1,1,1]], // I
    [[1,1],[1,1]], // O
    [[0,1,0],[1,1,1]], // T
    [[1,0],[1,0],[1,1]], // L
    [[0,1],[0,1],[1,1]], // J
    [[0,1,1],[1,1,0]], // S
    [[1,1,0],[0,1,1]], // Z
    [[1,1,1]], // small I
    [[1,0],[1,1]], // small L
    [[1]], // dot
    [[1,1,1],[0,1,0]], // big T
    [[1,1]], // line 2
  ];
  var PREFIXES = ['空明','澄澈','流光','星辉','霜华','云影'];
  var SUFFIXES = ['之心','之眼','之意','之息','之韵','之魄'];
  var ELEMENTS = ['火','水','风','地','光','暗','雷','冰','木','金'];
  var ACTIONS = [
    { type:'per_article', base:5, name:'阅读', desc:function(v){return '每篇文章 +'+v+' EXP';} },
    { type:'per_article', base:10, name:'深读', desc:function(v){return '每篇文章 +'+v+' EXP';} },
    { type:'per_article', base:15, name:'精读', desc:function(v){return '每篇文章 +'+v+' EXP';} },
    { type:'per_article', base:20, name:'博闻', desc:function(v){return '每篇文章 +'+v+' EXP';} },
    { type:'per_article', base:25, name:'通达', desc:function(v){return '每篇文章 +'+v+' EXP';} },
    { type:'direct_exp', base:30, name:'灵光', desc:function(v){return '直接 +'+v+' EXP';} },
    { type:'direct_exp', base:50, name:'启迪', desc:function(v){return '直接 +'+v+' EXP';} },
    { type:'direct_exp', base:80, name:'闪现', desc:function(v){return '直接 +'+v+' EXP';} },
    { type:'direct_exp', base:100, name:'顿悟', desc:function(v){return '直接 +'+v+' EXP';} },
    { type:'direct_exp', base:150, name:'涌现', desc:function(v){return '直接 +'+v+' EXP';} },
    { type:'direct_exp', base:200, name:'明悟', desc:function(v){return '直接 +'+v+' EXP';} },
    { type:'direct_exp', base:300, name:'爆发', desc:function(v){return '直接 +'+v+' EXP';} },
    { type:'direct_exp', base:500, name:'觉醒', desc:function(v){return '直接 +'+v+' EXP';} },
    { type:'direct_exp', base:1000, name:'超脱', desc:function(v){return '直接 +'+v+' EXP';} },
    { type:'multiplier', base:0.2, name:'专注', desc:function(v){return 'EXP ×'+(1+v).toFixed(1);} },
    { type:'multiplier', base:0.5, name:'心流', desc:function(v){return 'EXP ×'+(1+v).toFixed(1);} },
    { type:'multiplier', base:1, name:'超然', desc:function(v){return 'EXP ×'+(1+v).toFixed(1);} },
    { type:'multiplier', base:2, name:'神启', desc:function(v){return 'EXP ×'+(1+v).toFixed(1);} },
    { type:'extra_draw', base:1, name:'幸运', desc:function(v){return '每日 +'+v+' 次抽取';} },
    { type:'extra_draw', base:2, name:'天命', desc:function(v){return '每日 +'+v+' 次抽取';} },
    { type:'extra_draw', base:3, name:'眷顾', desc:function(v){return '每日 +'+v+' 次抽取';} },
    { type:'combo', base:3, name:'共鸣', desc:function(v){return '同系邻 +'+v+'%';} },
    { type:'combo', base:5, name:'星链', desc:function(v){return '同系邻 +'+v+'%';} },
    { type:'combo', base:8, name:'万象', desc:function(v){return '同系邻 +'+v+'%';} },
    { type:'combo', base:10, name:'星河', desc:function(v){return '满行 +'+v+'%';} },
    { type:'combo', base:15, name:'苍穹', desc:function(v){return '满列 +'+v+'%';} },
    { type:'passive', base:5, name:'滋养', desc:function(v){return '每时 +'+v+' EXP';} },
    { type:'passive', base:10, name:'冥想', desc:function(v){return '每时 +'+v+' EXP';} },
    { type:'passive', base:20, name:'禅定', desc:function(v){return '每时 +'+v+' EXP';} },
  ];

  var CARD_DB = [], ID = 0;
  ACTIONS.forEach(function(a){
    for(var e=0;e<ELEMENTS.length;e++){
      var pfx=PREFIXES[Math.floor(Math.random()*PREFIXES.length)];
      var sfx=SUFFIXES[Math.floor(Math.random()*SUFFIXES.length)];
      var sh=SHAPES[Math.floor(Math.random()*SHAPES.length)];
      var v=a.base+Math.floor(Math.random()*a.base*0.5);
      if(a.type==='multiplier'){v=a.base+Math.random()*a.base*0.3;v=Math.round(v*10)/10;}
      CARD_DB.push({id:ID++,name:ELEMENTS[e]+'·'+a.name,fullName:ELEMENTS[e]+'·'+a.name+sfx,element:ELEMENTS[e],type:a.type,val:v,desc:a.desc(v),shape:sh,w:sh[0]?sh[0].length:1,h:sh.length});
      if(CARD_DB.length>=120)break;
    }
    if(CARD_DB.length>=120)return;
  });
  while(CARD_DB.length<100){
    var s=CARD_DB[Math.floor(Math.random()*CARD_DB.length)];
    var sh=SHAPES[Math.floor(Math.random()*SHAPES.length)];
    CARD_DB.push({id:ID++,name:s.name,fullName:s.fullName,element:ELEMENTS[Math.floor(Math.random()*ELEMENTS.length)],type:s.type,val:s.val,desc:s.desc(s.val),shape:sh,w:sh[0]?sh[0].length:1,h:sh.length});
  }

  var RANKS = [];
  for(var r=1;r<=50;r++) RANKS.push({level:r,exp:Math.floor(100*r*(1+r*0.05))});

  var GS=5, MAX_DRAWS=10, MAX_INV=30, SK='xn_data', SGN='xn_sign';
  var state={
    level:1, exp:0, totalExp:0,
    grid:[], inventory:[], drawsToday:0, signToday:false, date:''
  };

  function getDate(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
  function load(){
    try{
      var raw=localStorage.getItem(SK);
      if(raw){var s=JSON.parse(raw);if(s.date===getDate()){state=s;}else{state.date=getDate();state.drawsToday=0;state.inventory=[];state.signToday=false;}}
    }catch(e){}
    if(state.grid.length===0){for(var i=0;i<GS;i++){state.grid[i]=[];for(var j=0;j<GS;j++)state.grid[i][j]=null;}}
    calcLevel();
  }
  function save(){try{localStorage.setItem(SK,JSON.stringify(state));}catch(e){}}

  function calcLevel(){
    for(var i=RANKS.length-1;i>=0;i--){if(state.totalExp>=RANKS[i].exp){state.level=RANKS[i].level;state.exp=state.totalExp-RANKS[i].exp;break;}}
    var nx=RANKS[state.level]?RANKS[state.level].exp:RANKS[RANKS.length-1].exp;
    var pr=state.level>1?RANKS[state.level-1].exp:0;
    return{pct:Math.min(100,(nx>pr?(state.totalExp-pr)/(nx-pr)*100:0)),next:nx,prev:pr};
  }

  var gridEl=document.getElementById('xnGrid'), invEl=document.getElementById('xnInventory');
  var levelNum=document.getElementById('xnLevelNum'), expBar=document.getElementById('xnExpBar');
  var expText=document.getElementById('xnExpText'), drawsLeft=document.getElementById('xnDrawsLeft');
  var totalExpEl=document.getElementById('xnTotalExp'), ranksEl=document.getElementById('xnRanks');

  function renderAll(){renderGrid();renderInv();renderHdr();renderRanks();}

  function renderHdr(){
    var info=calcLevel();
    levelNum.textContent='Lv.'+state.level;
    expBar.style.width=info.pct+'%';
    expText.textContent=state.exp+'/'+(info.next-info.prev);
    totalExpEl.textContent=state.totalExp;
    drawsLeft.textContent=Math.max(0,MAX_DRAWS-state.drawsToday);
  }

  function renderRanks(){
    var h='';
    for(var i=0;i<Math.min(10,RANKS.length);i++){
      var c=RANKS[i].level===state.level?'hl':'';
      h+='<span class="'+c+'">Lv.'+RANKS[i].level+'</span> <span style="color:rgba(255,255,255,0.05)">→</span> '
        +'<span class="'+c+'">'+RANKS[i].exp+'</span>';
      if(i<9&&i<RANKS.length-1)h+=' &nbsp; ';
    }
    ranksEl.innerHTML=h;
  }

  function renderGrid(){
    gridEl.innerHTML='';
    for(var y=0;y<GS;y++) for(var x=0;x<GS;x++){
      (function(cx,cy){
        var cell=document.createElement('div');
        cell.className='xn-cell'+(state.grid[cy][cx]?' has-block':'');
        cell.dataset.x=cx; cell.dataset.y=cy;
        cell.addEventListener('dragover',function(e){e.preventDefault();this.classList.add('drag-over');});
        cell.addEventListener('dragleave',function(){this.classList.remove('drag-over');});
        cell.addEventListener('drop',function(e){
          e.preventDefault();this.classList.remove('drag-over');
          var d=JSON.parse(e.dataTransfer.getData('text'));
          if(d&&d.cardId!==undefined)placeCard(d.cardId,d.idx,parseInt(this.dataset.x),parseInt(this.dataset.y));
        });
        // 点击已放置的方块卸下
        cell.addEventListener('click',function(){
          removeCard(parseInt(this.dataset.x),parseInt(this.dataset.y));
        });
        gridEl.appendChild(cell);
      })(x,y);
    }
  }

  function renderInv(){
    invEl.innerHTML='';
    if(state.inventory.length===0){invEl.innerHTML='<div class="xn-inv-empty">✦ 抽取心向</div>';return;}
    state.inventory.forEach(function(cardId,i){
      var card=CARD_DB[cardId];if(!card)return;
      var el=document.createElement('div');
      el.className='xn-block';el.draggable=true;
      el.style.gridTemplateColumns='repeat('+card.w+',16px)';
      el.style.gridTemplateRows='repeat('+card.h+',16px)';
      el.dataset.cardId=cardId; el.dataset.idx=i;
      for(var y=0;y<card.h;y++) for(var x=0;x<card.w;x++){
        var c=document.createElement('div');
        c.className='xn-block-cell'+(card.shape[y]&&card.shape[y][x]?' filled':'');
        el.appendChild(c);
      }
      var tip=document.createElement('div');
      tip.className='xn-tip';
      tip.innerHTML='<b>'+card.fullName+'</b><br>'+card.desc;
      el.appendChild(tip);
      el.addEventListener('dragstart',function(e){
        e.dataTransfer.setData('text',JSON.stringify({cardId:parseInt(this.dataset.cardId),idx:parseInt(this.dataset.idx)}));
      });
      invEl.appendChild(el);
    });
  }

  // 放置
  function placeCard(cardId,invIdx,gx,gy){
    var card=CARD_DB[cardId];if(!card)return;
    // 检查是否有位置
    for(var y=0;y<card.h;y++) for(var x=0;x<card.w;x++){
      if(card.shape[y]&&card.shape[y][x]){
        var px=gx+x,py=gy+y;
        if(px>=GS||py>=GS)return;
        if(state.grid[py][px]!==null)return;
      }
    }
    // 放置
    for(var y=0;y<card.h;y++) for(var x=0;x<card.w;x++){
      if(card.shape[y]&&card.shape[y][x]) state.grid[gy+y][gx+x]=cardId;
    }
    applyEffect(card);
    // 从背包移除
    if(invIdx>=0&&invIdx<state.inventory.length) state.inventory.splice(invIdx,1);
    else{var idx=state.inventory.indexOf(cardId);if(idx>=0)state.inventory.splice(idx,1);}
    save(); renderAll();
  }

  // 卸下（点击已放置的方块回到背包）
  function removeCard(gx,gy){
    var cardId=state.grid[gy][gx];
    if(!cardId)return;
    var card=CARD_DB[cardId];if(!card)return;
    // 从网格移除整张卡
    for(var y=0;y<GS;y++) for(var x=0;x<GS;x++){
      if(state.grid[y][x]===cardId) state.grid[y][x]=null;
    }
    // 回背包（如果未满）
    if(state.inventory.length<MAX_INV) state.inventory.push(cardId);
    save(); renderAll();
  }

  function applyEffect(card){
    if(card.type==='direct_exp'){state.totalExp+=Math.floor(card.val);}
  }

  function drawCards(){
    if(state.drawsToday>=MAX_DRAWS)return;
    var cnt=Math.min(MAX_DRAWS-state.drawsToday,MAX_DRAWS);
    for(var i=0;i<cnt;i++){
      var c=CARD_DB[Math.floor(Math.random()*CARD_DB.length)];
      if(state.inventory.length<MAX_INV)state.inventory.push(c.id);
      state.drawsToday++;
    }
    save();renderAll();
  }

  // 签到
  function signIn(){
    if(state.signToday)return;
    state.signToday=true;
    var bonus=50+Math.floor(Math.random()*50);
    state.totalExp+=bonus;
    save();renderAll();
    alert('☀ 签到成功！获得 +'+bonus+' EXP');
  }

  function clearGrid(){
    if(!confirm('清除心域中的所有心向？'))return;
    for(var y=0;y<GS;y++) for(var x=0;x<GS;x++) state.grid[y][x]=null;
    save();renderAll();
  }

  load();renderAll();
  document.getElementById('xnDrawBtn').addEventListener('click',drawCards);
  document.getElementById('xnSignBtn').addEventListener('click',signIn);
  document.getElementById('xnClearBtn').addEventListener('click',clearGrid);
})();
</script>
